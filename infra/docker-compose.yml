services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: benefits
      POSTGRES_PASSWORD: benefits
      POSTGRES_DB: benefits_compare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benefits -d benefits_compare"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6433:6333"
      - "6434:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8102:8000"
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      AUTO_CREATE_TABLES: "false"
      SEED_ON_STARTUP: "true"
      DATABASE_URL: postgresql+asyncpg://benefits:benefits@postgres:5432/benefits_compare
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - uploads_data:/app/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    profiles: ["app"]
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8102
    ports:
      - "3100:3100"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:

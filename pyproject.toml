[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Moderate, low-noise rule set: pyflakes + pycodestyle errors, import sorting,
# pyupgrade (modern syntax), and flake8-bugbear (common bug patterns).
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    # B008: function-call-in-default-argument. FastAPI's dependency-injection
    # pattern (`Depends(...)`, `Query(...)`, etc. as default values) triggers
    # this rule constantly; it's idiomatic FastAPI, not a bug.
    "B008",
]
